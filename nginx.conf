server {
    listen 80;
    server_name localhost;

    # 1. Servir la aplicación de React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. EL PROXY DEL ÉXITO: Rompe el CORS redirigiendo las peticiones a CKAN
    location /api-ckan/ {
        # Reescribe la URL para quitar el prefijo /api-ckan/ antes de enviarla a TACC
        rewrite ^/api-ckan/(.*)$ /$1 break;
        
        proxy_pass https://ckan.tacc.utexas.edu/;
        proxy_set_header Host ckan.tacc.utexas.edu;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forzar respuestas CORS en caso de que sea necesario, o simplemente limpiar headers
        proxy_hide_header 'Access-Control-Allow-Origin';
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}